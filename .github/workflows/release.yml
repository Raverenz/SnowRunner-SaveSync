name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Validate selected tag
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -ne ('refs/tags/' + $expected)) {
            throw 'Run this workflow on the version tag matching VERSION.'
          }
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -v
      - name: Build fresh release packages
        shell: pwsh
        run: python tools/build_release.py --tag "$env:GITHUB_REF_NAME"
      - name: Attest GitHub-built packages
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.zip
      - name: Keep workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packages
          path: release/*
          if-no-files-found: error
      - name: Create draft release for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assets --verify-tag --draft --title "SnowRunner SaveSync $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
